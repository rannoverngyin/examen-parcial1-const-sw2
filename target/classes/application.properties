spring.application.name=sesion26-optimizacion-consultas

# Base de datos H2 en archivo local (equivalente a universidad.db de SQLite)
spring.datasource.url=jdbc:h2:file:./universidad;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 para inspeccionar tablas e indices manualmente
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8100
logging.level.pe.unas.demoapi=INFO
