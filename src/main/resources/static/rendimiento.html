<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rendimiento S27</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    button { margin: 6px; padding: 10px 16px; font-size: 16px; cursor: pointer; }
    pre { background: #eef4f8; padding: 14px; border-radius: 8px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Comparación de rendimiento - Sesión 27</h1>
  <button onclick="probar('base')">Probar versión base</button>
  <button onclick="probar('optimizado')">Probar versión optimizada</button>
  <pre id="resultado">Sin medición</pre>

  <script>
    async function probar(version) {
      const inicio = performance.now();
      const respuesta = await fetch(`http://127.0.0.1:8082/rendimiento/productos/${version}`);
      const datos = await respuesta.json();
      const tiempo = performance.now() - inicio;
      
      document.getElementById('resultado').textContent =
        `versi\u00f3n=${version}\n` +
        `status=${respuesta.status}\n` +
        `tiempo=${tiempo.toFixed(2)} ms\n` +
        `datos=${JSON.stringify(datos)}`;
    }
  </script>
</body>
</html>
