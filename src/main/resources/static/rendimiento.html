<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rendimiento S27 - UNAS</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #333; }
    h1 { color: #0284c7; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
    button { margin: 6px; padding: 10px 16px; font-size: 14px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; transition: background 0.2s; }
    .btn-base { background-color: #ef4444; color: white; }
    .btn-base:hover { background-color: #dc2626; }
    .btn-opt { background-color: #10b981; color: white; }
    .btn-opt:hover { background-color: #059669; }
    pre { background: #0f172a; color: #38bdf8; padding: 18px; border-radius: 8px; overflow-x: auto; font-family: 'Courier New', Courier, monospace; }
  </style>
</head>
<body>
  <h1>Comparación de Rendimiento (Sesión 27)</h1>
  <p>Monitoreo de latencia percibida en el cliente (Frontend) mediante el uso de APIs de alto rendimiento.</p>
  <button class="btn-base" onclick="probar('base')">Probar versión base</button>
  <button class="btn-opt" onclick="probar('optimizado')">Probar versión optimizada</button>
  <pre id="resultado">Sin medición activa.</pre>

  <script>
    async function probar(version) {
      const inicio = performance.now();
      const respuesta = await fetch(`/rendimiento/productos/${version}`);
      const datos = await respuesta.json();
      const tiempo = performance.now() - inicio;
      document.getElementById('resultado').textContent =
        `Versión evaluada : ${version}\n` +
        `Estado HTTP      : ${respuesta.status}\n` +
        `Tiempo medido    : ${tiempo.toFixed(2)} ms\n` +
        `Datos devueltos  : ${JSON.stringify(datos)}`;
    }
  </script>
</body>
</html>
